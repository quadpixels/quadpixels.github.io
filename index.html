<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>千本算法题及其它</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top {
      height: 20pt; /* 初始高度 */
      padding: 1px;
      box-sizing: border-box;
      overflow: auto;
      border-bottom: 1px solid #ddd;
    }

    .resizer {
      height: 8px;
      background: #f2f2f2;
      cursor: row-resize;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      flex: 0 0 auto;
    }

    .resizer:hover {
      background: #e5e5e5;
    }

    .bottom {
      flex: 1;
      min-height: 80px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .links a {
      display: inline-block;
      color: #0080FF;
    }
    .links {
      white-space: nowrap;   /* 不换行 */
      overflow-x: auto;      /* 超出后横向滚动 */
    }
  </style>
</head>
<body>
  <div class="top" id="topPane">
    <span class="links" style="overscroll-behavior-x: contain; width:100%">
        <a href="#" id="placeholderLink"><b>Viz Stuff!</b></a>
        <a href="./LeetCode459/index.html" target="preview">459</a>

        <a href="./LeetCode2188/index.html" target="preview">2188</a>
        <a href="./LeetCode2197/index.html" target="preview">2197</a>
        <a href="./LeetCode2449/index.html" target="preview">2449</a>
        <a href="./LeetCode2772/index.html" target="preview">2772</a>
        <a href="./QuickSort/index.html" target="preview">Quicksort</a>
        <a href="./astar/index.html" target="preview">A*</a>
        <a href="./Lyrics20210206/client/index.html?solo=1" target="preview">𝄞</a>
    </span>

  <div class="resizer" id="resizer" aria-label="拖拽分隔条"></div>

  <div class="bottom">
    <iframe id="previewFrame" name="preview" title="预览区"></iframe>
  </div>

  <script>
    const topPane = document.getElementById("topPane");
    const resizer = document.getElementById("resizer");
    const placeholderLink = document.getElementById("placeholderLink");
    const previewFrame = document.getElementById("previewFrame");

    let dragging = false;

    resizer.addEventListener("mousedown", () => {
      dragging = true;
      document.body.style.userSelect = "none";
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;

      const min = 80;
      const max = window.innerHeight - min - resizer.offsetHeight;
      const next = Math.min(Math.max(e.clientY, min), max);

      topPane.style.height = next + "px";
    });

    window.addEventListener("mouseup", () => {
      dragging = false;
      document.body.style.userSelect = "";
    });

    placeholderLink.addEventListener("click", (e) => {
      e.preventDefault();
      previewFrame.srcdoc = `

              }

                padding: 24px 28px;

                border-radius: 10px;
                background: #fff;
              }
              small {
                color: #aaaaaa;
                font-size: 8pt;
              }
            </style>
          </head>
          <body>
            <div class="box">请点一个链接呗！
                <div class="links">
                    <br/>
                    <details open>
                    <summary>千本算法题相关</summary>

                    <a href="./LeetCode1531/index.html" target="preview">1531 (String Compression II)</a><small> p5js v0.10.2</small><br/>
                    <a href="./LeetCode1547/index.html" target="preview">1547 (Minimum Cost to Cut a Stick)</a><small> p5js v1.1.9</small><br/>
                    <a href="./LeetCode1675/index.html" target="preview">1675 (Minimize Deviation in Array)</a><small> p5js v1.1.9</small><br/>
                    <a href="./LeetCode2188/index.html" target="preview">2188 (Minimum Time to Finish the Race)</a><small> p5js v1.4.0, emscripten</small><br/>
                    <a href="./LeetCode2197/index.html" target="preview">2197 (Replace Non-Coprime Numbers in Array)</a><small> p5js v1.4.0, emscripten</small><br/>
                    <a href="./LeetCode2449/index.html" target="preview">2449 (Minimum Number of Operations to Make Arrays Similar)</a><small> p5js v1.4.1</small><br/>
                    <a href="./LeetCode2772/index.html" target="preview">2772 (Apply Operations to Make All Array Elements Equal to Zero)</a><small> p5js v1.6.0, emscripten</small><br/>
                    <a href="./QuickSort/index.html" target="preview">Quicksort</a><small> p5js v1.11.0, emscripten</small><br/>
                    <a href="./astar/index.html" target="preview">A star</a><small> p5js v1.1.9</small><br/>

                    <a href="./StarBG/index.html" target="preview">Star BG</a><small> p5js v1.1.9</small><br/>
                    <a href="./I2CTxnViz/index.html" target="preview">I2CTxnViz</a><small> p5js v1.1.9</small><br/>
                    <a href="./Cat/index.html" target="preview">大猫</a><small> p5js v1.11.0</small><br/>
                    </details>

                    <br/>
                    <details>
                    <summary>光追相关</summary>
                    <a href="./OBB/index.html" target="preview">OBB</a><small> p5js v1.11.7</small><br/>
                    <a href="./FibonacciCurve/index.html" target="preview">FibonacciCurve</a><small> p5js v1.11.7</small><br/>
                    <a href="./IntersectionTest/index.html" target="preview">IntersectionTest</a><small> p5js v1.11.11</small><br/>

      a.addEventListener("click", (e) => {
        e.preventDefault();
        previewFrame.removeAttribute("srcdoc"); // 关键
        previewFrame.src = a.getAttribute("href");
      });
    });
